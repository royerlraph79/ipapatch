name: Build ipapatch

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build for Linux
        type: boolean
        default: true
      build_macos_cross:
        description: Build macOS (cross-compiled on Linux)
        type: boolean
        default: true
      build_macos_native:
        description: Build macOS (native macOS runner)
        type: boolean
        default: true
      build_windows:
        description: Build for Windows
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux (${{ matrix.goarch }})
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/ipapatch-linux-${GOARCH}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipapatch-linux-${{ matrix.goarch }}
          path: dist/ipapatch-linux-${{ matrix.goarch }}
          if-no-files-found: error
          compression-level: 0

  macos-cross:
    name: Build macOS cross (${{ matrix.goarch }})
    if: ${{ inputs.build_macos_cross }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS cross binary
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/ipapatch-darwin-${GOARCH}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipapatch-darwin-${{ matrix.goarch }}
          path: dist/ipapatch-darwin-${{ matrix.goarch }}
          if-no-files-found: error
          compression-level: 0

  macos-native:
    name: Build macOS native (arm64)
    if: ${{ inputs.build_macos_native }}
    runs-on: macos-latest

    env:
      CGO_ENABLED: 0
      GOOS: darwin
      GOARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS native binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/ipapatch-darwin-arm64-native .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipapatch-darwin-arm64-native
          path: dist/ipapatch-darwin-arm64-native
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Build Windows (amd64)
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest

    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/ipapatch-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipapatch-windows-amd64
          path: dist/ipapatch-windows-amd64.exe
          if-no-files-found: error
          compression-level: 0
